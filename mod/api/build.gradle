// The API other mods compile against. It holds only the stable types (models, codecs, the entrypoint);
// the implementation lives in the main mod, which bundles this jar. The game being unobfuscated, no
// mappings are configured, as in the root project.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	// Lets sibling projects depend on the API from mavenLocal.
	id 'maven-publish'
}

base {
	archivesName = 'foley-api'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	// Published next to the API jar so consumers can read the API's sources in their IDE.
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

jar {
	from(rootProject.file('../LICENSE-MIT'))
	from(rootProject.file('../LICENSE-APACHE'))
}

// Publishes io.github.cumsauce:foley-api:<mod version> to mavenLocal for sibling projects. `archivesName` names the
// jar, but the publication's artifactId defaults to the project name ("api"), so it is set explicitly.
publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			groupId = 'io.github.cumsauce'
			artifactId = 'foley-api'
			version = project.version
		}
	}
	// Publishes to GitHub Packages when GITHUB_TOKEN is present; otherwise only mavenLocal is used, so local
	// development never needs credentials and `publishToMavenLocal` keeps working offline.
	if (System.getenv('GITHUB_TOKEN')) {
		repositories {
			maven {
				name = 'GitHubPackages'
				url = uri('https://maven.pkg.github.com/cumsauce/foley')
				credentials {
					username = System.getenv('GITHUB_ACTOR') ?: 'cumsauce'
					password = System.getenv('GITHUB_TOKEN')
				}
			}
		}
	}
}
