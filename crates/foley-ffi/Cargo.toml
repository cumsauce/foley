[package]
name = "foley-ffi"
description = "C ABI to Foley's synthesis, called by the Fabric mod through FFM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foley-synth.workspace = true

[dev-dependencies]
rtsan-standalone.workspace = true

[features]
# Measurement only, and off by default: with `audio-debug` the bed render
# path prints one stderr line per bed every ~0.25 s (see docs/audio-debug.md).
# The default build compiles none of it — the audio thread never allocates.
default = []
audio-debug = []

[lints]
workspace = true
