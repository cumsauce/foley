[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.50"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
foley-ffi = { path = "crates/foley-ffi" }
foley-dsp = { path = "crates/foley-dsp" }
foley-sim = { path = "crates/foley-sim" }
foley-math = { path = "crates/foley-math" }
foley-synth = { path = "crates/foley-synth" }

# Third party
anyhow = "1.0.104"
cbindgen = { version = "0.29.4", default-features = false }
# Off unless RTSAN_ENABLE is set, as in CI: then it fetches a prebuilt runtime.
rtsan-standalone = "0.3.0"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"

# Synthesis runs sample by sample: optimized in dev and test builds too, so
# tests that render seconds of audio stay quick.
[profile.dev.package.foley-synth]
opt-level = 2

[profile.dev.package.foley-dsp]
opt-level = 2

# The natives shipped in the mod jar (`cargo xtask natives`/`dist`), as in
# yakvc: one jar carries every platform's library, so optimize for size; the
# synthesis crate opts back into full speed.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
